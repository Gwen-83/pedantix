<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn ou Interpol</title>
    <link rel="stylesheet" href="/static/shared/game-ui.css" />
    <style>
      :root {
        --bg: #eef2ff;
        --card: #ffffff;
        --text: #172033;
        --muted: #54607a;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --success: #1f9d5f;
        --danger: #d92d20;
        --border: rgba(23, 32, 51, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #eef2ff 0%, #f7f8ff 100%);
        color: var(--text);
      }
      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 18px 48px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 22px;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.72rem;
        font-weight: 800;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3rem);
      }
      .score-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .scorebox {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 16px;
        box-shadow: 0 6px 18px rgba(79, 70, 229, 0.08);
        min-width: 120px;
        text-align: center;
      }
      .scorebox span {
        display: block;
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .scorebox strong {
        display: block;
        font-size: 1.5rem;
        margin-top: 4px;
      }
      .mode-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 18px;
      }
      .mode-btn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.7);
        color: var(--text);
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
      }
      .mode-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.2);
      }
      .main-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(260px, 0.8fr);
        gap: 18px;
      }
      .game {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
      }
      .photo-wrap {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 440px;
        background: linear-gradient(135deg, #f3f4ff 0%, #eef6ff 100%);
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(79, 70, 229, 0.08);
      }
      .photo-wrap img {
        width: min(100%, 420px);
        max-height: 440px;
        object-fit: cover;
        border-radius: 18px;
        box-shadow: 0 12px 25px rgba(15, 23, 42, 0.12);
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
      }
      .person {
        flex: 1;
        min-width: 220px;
      }
      .person-name {
        margin: 0;
        font-size: clamp(1.3rem, 2vw, 2rem);
      }
      .person-description {
        color: var(--muted);
        margin: 8px 0 0;
        line-height: 1.5;
      }
      .round-pill {
        align-self: center;
        background: #f3f4ff;
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--primary-dark);
        font-weight: 700;
      }
      .result {
        margin-top: 14px;
        min-height: 48px;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 10px;
        display: none;
      }
      .result.correct {
        display: block;
        background: rgba(31, 157, 95, 0.08);
        color: var(--success);
      }
      .result.incorrect {
        display: block;
        background: rgba(217, 45, 32, 0.08);
        color: var(--danger);
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-top: 22px;
      }
      button.choice {
        appearance: none;
        border: none;
        border-radius: 14px;
        padding: 18px 18px;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          opacity 0.15s ease;
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.08);
      }
      button.choice:hover:not(:disabled) {
        transform: translateY(-1px);
      }
      button.choice:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      button.choice.linkedin {
        background: linear-gradient(135deg, #dfe7ff 0%, #edf3ff 100%);
      }
      button.choice.interpol {
        background: linear-gradient(135deg, #ffe3e3 0%, #fff2f2 100%);
      }
      .footer-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .status {
        color: var(--muted);
      }
      .replay {
        display: none;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 700;
        cursor: pointer;
      }
      .replay.visible {
        display: inline-block;
      }
      .sidebar {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 20px;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
      }
      .sidebar h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }
      .leaderboard {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }
      .leaderboard li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        background: #f7f8ff;
        border-radius: 12px;
      }
      .leaderboard .player {
        font-weight: 700;
      }
      .leaderboard .score {
        color: var(--primary-dark);
        font-weight: 700;
      }
      @media (max-width: 900px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 680px) {
        .choices {
          grid-template-columns: 1fr;
        }
        .photo-wrap {
          min-height: 340px;
        }
        .header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div>
          <p class="eyebrow">Jeu d’identification</p>
          <h1>LinkedIn ou Interpol</h1>
        </div>
        <div class="score-row">
          <div class="scorebox">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="scorebox">
            <span>Série</span>
            <strong id="streak">0</strong>
          </div>
        </div>
      </div>

      <div class="mode-bar" aria-label="Choix du mode de jeu">
        <button class="mode-btn active" type="button" data-mode="solo">
          Solo · 10 manches
        </button>
        <button class="mode-btn" type="button" data-mode="multiplayer">
          Multijoueur · 10 manches
        </button>
        <button class="mode-btn" type="button" data-mode="solo-infinite">
          Solo infini
        </button>
      </div>

      <div class="main-grid">
        <div class="game">
          <div class="photo-wrap">
            <img id="photo" alt="Portrait à identifier" />
          </div>

          <div class="meta">
            <div class="person">
              <h2 id="person-name" class="person-name">—</h2>
              <p id="person-description" class="person-description"></p>
            </div>
            <div id="round-label" class="round-pill">Manche 1 / 1</div>
          </div>

          <div id="result" class="result"></div>

          <div class="choices">
            <button
              class="choice linkedin"
              data-choice="linkedin"
              type="button"
            >
              LinkedIn
            </button>
            <button
              class="choice interpol"
              data-choice="interpol"
              type="button"
            >
              Interpol
            </button>
          </div>

          <div class="footer-actions">
            <div id="status-text" class="status">Chargement…</div>
            <button id="replay" class="replay" type="button">Rejouer</button>
          </div>
        </div>

        <aside class="sidebar">
          <h2>Classement infini</h2>
          <ul id="leaderboard-list" class="leaderboard"></ul>
        </aside>
      </div>
    </div>

    <script src="/static/shared/presence.js"></script>
    <script>
      const scoreEl = document.getElementById("score");
      const streakEl = document.getElementById("streak");
      const photoEl = document.getElementById("photo");
      const personNameEl = document.getElementById("person-name");
      const personDescriptionEl = document.getElementById("person-description");
      const resultEl = document.getElementById("result");
      const roundLabelEl = document.getElementById("round-label");
      const replayBtn = document.getElementById("replay");
      const statusTextEl = document.getElementById("status-text");
      const leaderboardListEl = document.getElementById("leaderboard-list");
      const buttons = [...document.querySelectorAll(".choice")];
      const modeButtons = [...document.querySelectorAll(".mode-btn")];

      const localPlayerId =
        localStorage.getItem("linkedin_or_interpol_player_id") ||
        (globalThis.crypto && crypto.randomUUID
          ? crypto.randomUUID()
          : `linkedin-${Date.now()}`);
      localStorage.setItem("linkedin_or_interpol_player_id", localPlayerId);

      let selectedMode =
        localStorage.getItem("linkedin_or_interpol_mode") || "solo";
      let currentGame = null;
      let locked = false;

      function setStatus(message) {
        statusTextEl.textContent = message;
      }

      function updateScore(score) {
        scoreEl.textContent = String(score || 0);
      }

      function updateStreak(streak) {
        streakEl.textContent = String(streak || 0);
      }

      function setRoundLabel(roundIndex, roundCount) {
        if (!roundCount || roundCount <= 0) {
          roundLabelEl.textContent = "Série en cours";
          return;
        }
        const current = Math.min(roundIndex + 1, roundCount);
        roundLabelEl.textContent = `Manche ${current} / ${roundCount}`;
      }

      function renderPerson(person) {
        if (!person) {
          photoEl.src = "";
          personNameEl.textContent = "—";
          personDescriptionEl.textContent = "";
          return;
        }
        photoEl.src = person.image_url;
        photoEl.alt = `Portrait ${person.name || "inconnu"}`;
        personNameEl.textContent =
          `${person.surname || ""} ${person.name || ""}`.trim() ||
          "Personne inconnue";
        personDescriptionEl.textContent = person.description || "—";
      }

      function disableButtons(disabled) {
        buttons.forEach((button) => {
          button.disabled = disabled;
        });
      }

      function renderLeaderboard(records) {
        leaderboardListEl.innerHTML = "";
        if (!records.length) {
          const empty = document.createElement("li");
          empty.innerHTML =
            '<span class="player">Aucun record</span><span class="score">0</span>';
          leaderboardListEl.appendChild(empty);
          return;
        }
        records.forEach((record) => {
          const item = document.createElement("li");
          item.innerHTML = `
            <span class="player">#${record.rank} ${record.player_id}</span>
            <span class="score">${record.best_streak} sér.</span>
          `;
          leaderboardListEl.appendChild(item);
        });
      }

      async function fetchLeaderboard() {
        try {
          const response = await fetch(
            "/api/linkedin-or-interpol/leaderboard?limit=10",
          );
          if (!response.ok) throw new Error("Leaderboard inaccessible");
          const data = await response.json();
          renderLeaderboard(data.records || []);
        } catch (error) {
          renderLeaderboard([]);
        }
      }

      function updateModeButtons() {
        modeButtons.forEach((button) => {
          button.classList.toggle(
            "active",
            button.dataset.mode === selectedMode,
          );
        });
      }

      function renderState(state) {
        currentGame = state;
        updateScore(state.score || 0);
        updateStreak(state.streak || 0);
        if (state.mode === "solo-infinite") {
          roundLabelEl.textContent =
            state.status === "finished"
              ? `Meilleure série · ${state.best_streak || 0}`
              : `Série en cours · ${state.streak || 0}`;
        } else {
          setRoundLabel(state.round_index || 0, state.round_count || 1);
        }
        renderPerson(state.current_person);
        if (state.status === "finished") {
          setStatus(
            state.mode === "solo-infinite"
              ? `Partie terminée — meilleure série : ${state.best_streak || 0}`
              : `Partie terminée`,
          );
          replayBtn.classList.add("visible");
          return;
        }
        replayBtn.classList.remove("visible");
        setStatus(
          state.mode === "solo-infinite"
            ? `Série actuelle : ${state.streak || 0} · record : ${state.best_streak || 0}`
            : "Choisissez LinkedIn ou Interpol",
        );
      }

      async function createGame(mode = selectedMode) {
        selectedMode = mode;
        localStorage.setItem("linkedin_or_interpol_mode", selectedMode);
        updateModeButtons();
        locked = false;
        resultEl.className = "result";
        resultEl.textContent = "";
        disableButtons(false);

        const params = new URLSearchParams({
          player_id: localPlayerId,
          mode,
          rounds: mode === "solo-infinite" ? "20" : "10",
        });

        const response = await fetch(
          `/api/linkedin-or-interpol/new?${params.toString()}`,
        );
        if (!response.ok) {
          const errorJson = await response.json().catch(() => ({}));
          throw new Error(
            errorJson.detail || "Impossible de charger la partie.",
          );
        }

        const state = await response.json();
        renderState(state);
      }

      async function submitGuess(choice) {
        if (!currentGame || locked) return;
        locked = true;
        disableButtons(true);

        const payload = {
          game_id: currentGame.game_id,
          player_id: currentGame.player_id,
          guess: choice,
        };

        const response = await fetch("/api/linkedin-or-interpol/guess", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const errorJson = await response.json().catch(() => ({}));
          throw new Error(errorJson.detail || "Erreur lors de la validation.");
        }

        const state = await response.json();
        const result = state.result;
        const answerLabel =
          result.answer === "linkedin" ? "LinkedIn" : "Interpol";
        const guessedLabel =
          result.guess === "linkedin" ? "LinkedIn" : "Interpol";

        resultEl.className = `result ${result.correct ? "correct" : "incorrect"}`;
        resultEl.textContent =
          result.message ||
          (result.correct
            ? `Bonne réponse ! C’était ${answerLabel}.`
            : `Raté ! C’était ${answerLabel}. Tu as choisi ${guessedLabel}.`);

        updateScore(state.score || 0);
        updateStreak(state.streak || 0);

        if (state.mode === "solo-infinite") {
          roundLabelEl.textContent = `Série en cours · ${state.streak || 0}`;
        } else {
          setRoundLabel(state.round_index || 0, state.round_count || 1);
        }

        if (state.status === "finished") {
          setStatus(
            state.mode === "solo-infinite"
              ? `Partie terminée — meilleure série : ${state.best_streak || 0}`
              : `Partie terminée — score final : ${state.score}`,
          );
          replayBtn.classList.add("visible");
          await fetchLeaderboard();
          return;
        }

        renderPerson(state.current_person);
        setStatus(
          state.mode === "solo-infinite"
            ? `Série actuelle : ${state.streak || 0} · record : ${state.best_streak || 0}`
            : "Suivant…",
        );

        setTimeout(() => {
          locked = false;
          disableButtons(false);
          renderState(state);
        }, 1200);
      }

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => createGame(button.dataset.mode));
      });

      buttons.forEach((button) => {
        button.addEventListener("click", () =>
          submitGuess(button.dataset.choice),
        );
      });

      replayBtn.addEventListener("click", () => {
        createGame(selectedMode);
      });

      updateModeButtons();
      fetchLeaderboard();
      createGame(selectedMode).catch((error) => {
        setStatus(error.message || "Erreur de chargement");
        resultEl.className = "result incorrect";
        resultEl.textContent = "Impossible de charger le jeu.";
      });
    </script>
  </body>
</html>
